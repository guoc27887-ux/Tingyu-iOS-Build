name: Tingyu
options:
  bundleIdPrefix: io.github.huleixin
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.5.151"
    CURRENT_PROJECT_VERSION: "368"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Tingyu:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: web
        type: folder
        name: web
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 听屿
        CFBundleShortVersionString: "1.5.151"
        CFBundleVersion: "368"
        UILaunchStoryboardName: LaunchScreen
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: 保存封面图片到相册
        NSLocalNetworkUsageDescription: 本地音频服务
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.huleixin.tingyu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
